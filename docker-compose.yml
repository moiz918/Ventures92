# =============================================================================
# Ventures 92 — Docker Compose (Development)
# =============================================================================
# Services: frontend (Next.js) · backend (FastAPI) · db (PostgreSQL) · pgadmin
# Usage:    docker-compose up --build
# =============================================================================

name: ventures92

services:

  # ---------------------------------------------------------------------------
  # Frontend — Next.js 14 App Router
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: v92_frontend
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount source so edits on the host are reflected instantly
      - ./frontend:/app
      # Anonymous volumes: prevent the host from clobbering the container's
      # installed node_modules and the Next.js build cache
      - /app/node_modules
      - /app/.next
    environment:
      # Enable webpack/chokidar polling so HMR works inside Docker on
      # Windows (WSL2) and macOS where inotify events don't propagate
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # Server-side fetch calls inside the container reach FastAPI via the
      # Docker internal network name ("backend"), not localhost
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - INTERNAL_API_URL=http://backend:8000/api/v1
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - v92_network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend — FastAPI + Uvicorn
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: v92_backend
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount source for hot reloading via uvicorn --reload + watchfiles
      - ./backend:/app
      # Anonymous volumes: keep Python bytecode caches inside the container
      - /app/__pycache__
      - /app/app/__pycache__
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PROJECT_NAME=Ventures 92
    # Override CMD from Dockerfile to enforce --reload in dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    networks:
      - v92_network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Database — PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: v92_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      # Named volume: data survives docker-compose down
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - v92_network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # pgAdmin 4 — visual Postgres management
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: v92_pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - v92_network
    restart: unless-stopped

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  v92_network:
    driver: bridge
